<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Repaso gratuito para el Saber Pro: Lectura Crítica, Razonamiento Cuantitativo y Competencias Ciudadanas, con explicación de cada respuesta.">
<title>Saber Pro — repaso</title>
<style>

:root{
  --bg:#0f1021; --bg2:#1a1b3a; --card:#232450; --txt:#f2f3ff; --dim:#9fa3cf;
  --a:#e2413f; --b:#1368ce; --c:#d89e00; --d:#26890c; --ok:#26890c; --bad:#e2413f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 4px 10px;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.3px}
.pill{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;
  padding:4px 11px;font-size:.78rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--txt)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
.menu{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:20px;margin-top:8px}
.menu h2{margin:0 0 4px;font-size:1.5rem}
.menu p{color:var(--dim);margin:0 0 18px;font-size:.92rem;line-height:1.5}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid.dos{grid-template-columns:1fr 1fr}}
.opt-area{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.chk{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff1a;
  border-radius:12px;padding:11px 13px;font-size:.95rem}
.chk input{width:18px;height:18px;accent-color:#7c6cff}
.chk .n{margin-left:auto;color:var(--dim);font-size:.82rem}
.btn{background:#7c6cff;color:#fff;padding:15px 18px;font-weight:800;font-size:1rem;width:100%}
.btn.sec{background:#ffffff14;color:var(--txt);font-weight:600}
.btn:active{transform:translateY(1px)}
.bar{height:6px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:#7c6cff;transition:width .3s}
.qbox{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.72rem;padding:3px 9px;border-radius:99px;background:#ffffff14;color:var(--dim)}
.tag.warn{background:#d89e0033;color:#ffd978}
.q{font-size:1.18rem;line-height:1.45;font-weight:700;margin:0 0 16px}
details.ctx{margin:0 0 14px;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:12px}
details.ctx summary{cursor:pointer;padding:11px 14px;font-size:.88rem;color:#b9bdf0;font-weight:600}
details.ctx .body{padding:0 14px 14px;font-size:.9rem;line-height:1.6;color:#dfe1ff;
  max-height:52vh;overflow:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 15px;
  color:#fff;font-size:.97rem;line-height:1.4;width:100%;opacity:.97;transition:.15s}
.opt .k{font-weight:900;flex:0 0 auto;width:22px}
.opt .gr{display:block;width:100%;max-width:430px;margin:8px 0 2px;border-radius:8px;background:#fff}
.opt.A{background:var(--a)} .opt.B{background:var(--b)}
.opt.C{background:var(--c)} .opt.D{background:var(--d)}
.opt:disabled{opacity:.35}
.opt.win{opacity:1;outline:3px solid #fff;transform:scale(1.01)}
.opt.lose{opacity:.3;filter:grayscale(.6)}
.fb{margin-top:16px;border-radius:14px;padding:14px 15px;font-size:.93rem;line-height:1.55;display:none}
.fb.ok{background:#26890c26;border:1px solid #26890c66}
.fb.bad{background:#e2413f26;border:1px solid #e2413f66}
.fb b{display:block;margin-bottom:5px;font-size:1rem}
.fb .why{color:#e8e9ff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:1.5rem;font-weight:800}
.stat .l{font-size:.72rem;color:var(--dim);margin-top:2px}
.foot{color:var(--dim);font-size:.75rem;text-align:center;padding:16px 8px 28px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#000000cc;
  border:1px solid #ffffff22;padding:10px 16px;border-radius:99px;font-size:.85rem;display:none}
details.ctx .body p{margin:0 0 .7em}
details.ctx .body ul,details.ctx .body ol{margin:0 0 .7em;padding-left:1.3em}
details.ctx .body img{display:block;max-width:100%;margin:8px 0;border-radius:8px;background:#fff}
details.ctx .body table{border-collapse:collapse;font-size:.8rem;margin:0 0 .8em;display:block;overflow-x:auto}
details.ctx .body th,details.ctx .body td{border:1px solid #ffffff2a;padding:4px 7px;text-align:left}
details.ctx .nota{font-size:.78rem;color:var(--dim);font-style:italic}
.reloj{font-variant-numeric:tabular-nums}
.reloj.poco{color:#ffd978;border-color:#d89e0066}
.repaso{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.repaso .it{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.5}
.repaso .it .rq{font-weight:700;margin-bottom:4px}
.repaso .it .ra{color:#9ff59a;margin-bottom:4px}
.repaso .it .rt{color:var(--dim)}
.foot a{color:#b9bdf0}
</style></head>
<body><div class="wrap">

<header>
  <h1>⚡ Saber Pro — repaso</h1>
  <span class="pill" id="pillRonda">ronda <b>1</b></span>
  <span class="pill" id="pillRacha">racha <b>0</b></span>
  <span class="pill" id="pillGlobal">—</span>
  <span class="pill reloj" id="pillReloj" style="display:none"></span>
</header>

<section id="menu" class="menu">
  <h2>¿Qué repasamos?</h2>
  <p id="sub"></p>
  <div class="opt-area" id="areas"></div>
  <div class="opt-area">
    <label class="chk"><input type="checkbox" id="soloFallos">
      Solo las que he fallado <span class="n" id="nFallos">0</span></label>
    <label class="chk"><input type="checkbox" id="modoExamen">
      Modo examen: con reloj, sin explicaciones hasta el final <span class="n" id="nMin"></span></label>
  </div>
  <div class="grid dos">
    <button class="btn" onclick="empezar()">Empezar</button>
    <button class="btn sec" onclick="verStats()">Ver mi progreso</button>
  </div>
</section>

<section id="juego" style="display:none">
  <div class="bar"><i id="barra" style="width:0%"></i></div>
  <div class="qbox">
    <div class="meta" id="meta"></div>
    <div id="ctxHolder"></div>
    <p class="q" id="enunciado"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="nav" id="nav" style="display:none">
      <button class="btn" id="btnSig" onclick="siguiente()">Siguiente →</button>
      <button class="btn sec" onclick="salir()">Salir</button>
    </div>
    <div class="nav" id="navExamen" style="display:none">
      <button class="btn sec" onclick="terminar()">Terminar examen</button>
    </div>
  </div>
</section>

<section id="fin" class="menu" style="display:none">
  <h2 id="finTit">Ronda terminada</h2>
  <div class="stats" id="finStats"></div>
  <p class="sub" id="finTxt" style="color:var(--dim);font-size:.9rem;line-height:1.5"></p>
  <div class="repaso" id="finRepaso"></div>
  <div class="grid dos" style="margin-top:16px">
    <button class="btn" onclick="empezar()">Otra ronda ↻</button>
    <button class="btn sec" onclick="salir()">Menú</button>
  </div>
</section>

<p class="foot" id="foot"></p>
<div class="toast" id="toast"></div>
</div>

<script>
const DATA = __DATOS__;
const LS = 'saberpro-progreso-v1';
const SEG_POR_PREGUNTA = DATA.config.segundos_por_pregunta || 120;
let prog = {q:{}, rondas:0, mejorRacha:0};
try { prog = Object.assign(prog, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e) {}
let cola = [], idx = 0, actual = null, racha = 0, examen = false, reloj = null, fin = 0;
let sesion = null;
const $ = s => document.querySelector(s);
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(prog)); } catch(e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nombreArea = slug => DATA.areas[slug] || slug;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';
  clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800);}

// ---------- menu ----------
function pintarMenu(){
  const porArea = {};
  DATA.preguntas.forEach(p => porArea[p.area] = (porArea[p.area]||0)+1);
  $('#areas').innerHTML = Object.entries(porArea).map(([a,n]) =>
    `<label class="chk"><input type="checkbox" class="area" value="${a}" checked>
     ${esc(nombreArea(a))} <span class="n">${n}</span></label>`).join('');
  let sub = `${DATA.preguntas.length} preguntas tipo Saber Pro con la respuesta correcta y su explicación.`;
  const fx = DATA.config.fecha_examen;
  if (fx){
    const dias = Math.ceil((new Date(fx + 'T07:00:00-05:00') - new Date())/86400000);
    if (dias > 0) sub += ` ${DATA.config.nombre_examen || 'Examen'}: faltan ${dias} día${dias==1?'':'s'}.`;
  }
  $('#sub').textContent = sub;
  $('#nFallos').textContent = Object.values(prog.q).filter(q => q.mal > 0).length;
  $('#nMin').textContent = `${Math.round(SEG_POR_PREGUNTA/60*10)/10} min/pregunta`;
  const ok = Object.values(prog.q).reduce((s,q)=>s+q.ok,0);
  const mal = Object.values(prog.q).reduce((s,q)=>s+q.mal,0);
  $('#pillGlobal').innerHTML = (ok+mal) ? `acierto <b>${Math.round(100*ok/(ok+mal))}%</b>` : 'sin datos';
  $('#pillRonda').innerHTML = `ronda <b>${prog.rondas+1}</b>`;
  $('#pillRacha').innerHTML = `mejor racha <b>${prog.mejorRacha}</b>`;
}

function seleccion(){
  const areas = [...document.querySelectorAll('.area:checked')].map(e=>e.value);
  let qs = DATA.preguntas.filter(p => areas.includes(p.area));
  if ($('#soloFallos').checked) qs = qs.filter(p => (prog.q[p.id]||{}).mal > 0);
  return qs;
}

function barajar(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// las que más has fallado salen primero dentro del barajado
function ordenar(qs){
  const peso = {};
  qs.forEach(p => {const q=prog.q[p.id]||{ok:0,mal:0}; peso[p.id] = (q.mal*2 - q.ok) + Math.random()*1.5;});
  return barajar(qs.slice()).sort((a,b)=>peso[b.id]-peso[a.id]);
}

// en examen las preguntas de un mismo texto van juntas, como en la prueba real
function ordenExamen(qs){
  const grupos = {};
  qs.forEach(p => (grupos[p.area+'|'+p.contexto] ||= []).push(p));
  return barajar(Object.values(grupos)).flatMap(g => g.sort((a,b)=>a.n-b.n));
}

function empezar(){
  const qs = seleccion();
  if (!qs.length) return toast('Esa combinación no deja ninguna pregunta');
  examen = $('#modoExamen').checked;
  cola = examen ? ordenExamen(qs) : ordenar(qs);
  idx = 0; racha = 0;
  sesion = {ok:0, mal:0, t0:Date.now(), areas:{}, fallos:[], total:cola.length};
  $('#menu').style.display='none'; $('#fin').style.display='none';
  $('#juego').style.display='block';
  clearInterval(reloj); $('#pillReloj').style.display='none';
  if (examen){
    fin = Date.now() + cola.length * SEG_POR_PREGUNTA * 1000;
    $('#pillReloj').style.display=''; tic(); reloj = setInterval(tic, 1000);
  }
  pintar();
}

function tic(){
  const r = Math.max(0, fin - Date.now());
  const m = Math.floor(r/60000), s = Math.floor(r/1000)%60;
  const e = $('#pillReloj');
  e.innerHTML = `⏱ <b>${m}:${String(s).padStart(2,'0')}</b>`;
  e.classList.toggle('poco', r < 5*60000);
  if (r <= 0){ toast('Se acabó el tiempo'); terminar(); }
}

// ---------- juego ----------
function pintar(){
  actual = cola[idx];
  $('#barra').style.width = (100*idx/cola.length)+'%';
  $('#pillRonda').innerHTML = `ronda <b>${prog.rondas+1}</b> · ${idx+1}/${cola.length}`;
  $('#pillRacha').innerHTML = `racha <b>${racha}</b>`;
  const q = prog.q[actual.id] || {ok:0,mal:0};
  $('#meta').innerHTML =
    `<span class="tag">${esc(nombreArea(actual.area))}</span>`
    + `<span class="tag">#${actual.n}</span>`
    + (Object.keys(actual.opciones).length < 4 ? `<span class="tag warn">el original trae solo ${Object.keys(actual.opciones).length} opciones</span>` : '')
    + (q.mal && !examen ? `<span class="tag warn">la has fallado ${q.mal}×</span>` : '');

  const c = (DATA.contextos[actual.area] || [])[actual.contexto];
  const prev = $('#ctxHolder details');
  const abierto = prev && prev.open && prev.dataset.k === actual.area+'|'+actual.contexto;
  $('#ctxHolder').innerHTML = c
    ? `<details class="ctx" data-k="${actual.area}|${actual.contexto}" ${abierto?'open':''}>
       <summary>📄 ${c.resumen ? 'Resumen del texto' : 'Texto'} ${actual.contexto+1}: ${esc(c.titulo)}</summary>
       <div class="body">${c.resumen ? '<p class="nota">El texto original no está disponible; este es un resumen con lo necesario para responder.</p>' : ''}${c.html}</div></details>` : '';

  $('#enunciado').textContent = actual.enunciado;
  $('#opts').innerHTML = Object.keys(actual.opciones).sort().map(L =>
    `<button class="opt ${L}" data-k="${L}" onclick="responder('${L}')">
       <span class="k">${L}</span><span>${esc(actual.opciones[L])}
       ${(actual.imagenes && actual.imagenes[L]) ? `<img class="gr" src="${actual.imagenes[L]}" alt="opción ${L}">` : ''}
       </span></button>`).join('');
  $('#fb').style.display='none'; $('#nav').style.display='none';
  $('#navExamen').style.display = examen ? 'flex' : 'none';
}

function responder(L){
  if (!actual || document.querySelector('.opt:disabled')) return;
  const bien = (L === actual.correcta);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if (examen){ if (b.dataset.k === L) b.classList.add('win'); return; }
    if (b.dataset.k === actual.correcta) b.classList.add('win');
    else if (b.dataset.k === L) b.classList.add('lose');
  });
  const q = prog.q[actual.id] || {ok:0,mal:0};
  bien ? q.ok++ : q.mal++;
  q.ult = Date.now(); prog.q[actual.id] = q;
  bien ? sesion.ok++ : sesion.mal++;
  const a = sesion.areas[actual.area] || {ok:0,mal:0};
  bien ? a.ok++ : a.mal++; sesion.areas[actual.area] = a;
  if (!bien && !sesion.fallos.some(f => f.p === actual)) sesion.fallos.push({p:actual, marcada:L});
  racha = bien ? racha+1 : 0;
  if (racha > prog.mejorRacha) prog.mejorRacha = racha;
  $('#pillRacha').innerHTML = `racha <b>${racha}</b>`;
  guardar();

  if (examen){ setTimeout(siguiente, 250); return; }

  // en repaso, la fallada vuelve a salir unas preguntas después
  if (!bien) cola.splice(Math.min(idx+4, cola.length), 0, actual);
  const fb = $('#fb');
  fb.className = 'fb ' + (bien ? 'ok' : 'bad');
  fb.innerHTML = `<b>${bien ? '✅ Correcta' : '❌ Era la ' + actual.correcta}</b>`
    + (actual.explicacion ? `<div class="why">${actual.explicacion}</div>` : '');
  fb.style.display='block';
  $('#nav').style.display='flex';
  $('#btnSig').textContent = (idx+1 >= cola.length) ? 'Ver resultado →' : 'Siguiente →';
}

function siguiente(){
  if (!sesion || $('#juego').style.display === 'none') return;
  idx++; (idx >= cola.length) ? terminar() : pintar();
}

function terminar(){
  if ($('#juego').style.display === 'none') return;
  clearInterval(reloj); $('#pillReloj').style.display='none';
  prog.rondas++; guardar();
  const tot = examen ? sesion.total : sesion.ok + sesion.mal;
  const pct = tot ? Math.round(100*sesion.ok/tot) : 0;
  const mins = Math.round((Date.now()-sesion.t0)/60000);
  $('#juego').style.display='none'; $('#fin').style.display='block';
  $('#finTit').textContent = pct>=80 ? '💪 Buena ronda' : pct>=60 ? 'Ronda terminada' : 'Hay que insistir';
  $('#finStats').innerHTML =
     `<div class="stat"><div class="v">${pct}%</div><div class="l">acierto</div></div>`
   + `<div class="stat"><div class="v">${sesion.ok}/${tot}</div><div class="l">correctas</div></div>`
   + `<div class="stat"><div class="v">${mins}′</div><div class="l">duración</div></div>`;
  const porArea = Object.entries(sesion.areas)
    .map(([a,v]) => `${esc(nombreArea(a))}: ${Math.round(100*v.ok/(v.ok+v.mal))}%`).join(' · ');
  const sinResp = examen ? tot - sesion.ok - sesion.mal : 0;
  $('#finTxt').innerHTML = porArea
    + (sinResp ? `<br>${sinResp} sin responder (cuentan como incorrectas).` : '')
    + `<br><br>Mejor racha histórica: ${prog.mejorRacha}. Las que fallaste salen primero en la próxima ronda.`;
  $('#finRepaso').innerHTML = (examen && sesion.fallos.length)
    ? '<h3 style="margin:6px 0 0">Repaso de las que fallaste</h3>' + sesion.fallos.map(({p, marcada}) =>
      `<div class="it"><div class="rq">${esc(nombreArea(p.area))} #${p.n} — ${esc(p.enunciado)}</div>
       <div class="ra">✅ ${p.correcta}) ${esc(p.opciones[p.correcta]) || '(ver gráfica)'} <span class="rt">· marcaste ${marcada}</span></div>
       <div class="rt">${p.explicacion}</div></div>`).join('')
    : '';
}

function salir(){ clearInterval(reloj); $('#pillReloj').style.display='none';
  $('#juego').style.display='none'; $('#fin').style.display='none';
  $('#menu').style.display='block'; pintarMenu(); }

function verStats(){
  const e = Object.entries(prog.q);
  if (!e.length) return toast('Todavía no has respondido nada');
  const porArea = {};
  DATA.preguntas.forEach(p=>{
    const q = prog.q[p.id]; if(!q) return;
    const a = porArea[p.area] || {ok:0,mal:0}; a.ok+=q.ok; a.mal+=q.mal; porArea[p.area]=a;
  });
  const lineas = Object.entries(porArea)
    .map(([a,v]) => `${nombreArea(a)}: ${Math.round(100*v.ok/(v.ok+v.mal))}% (${v.ok+v.mal} intentos)`);
  const peores = e.filter(([,q])=>q.mal>0).sort((a,b)=>b[1].mal-a[1].mal).slice(0,5)
    .map(([id,q])=>`${id} (${q.mal} fallos)`);
  alert('TU PROGRESO\n\n' + lineas.join('\n')
    + `\n\nRondas jugadas: ${prog.rondas}\nMejor racha: ${prog.mejorRacha}`
    + (peores.length ? `\n\nLas que más fallas:\n- ${peores.join('\n- ')}` : '')
    + '\n\n(Se guarda solo en este navegador.)');
}

document.addEventListener('keydown', e=>{
  if ($('#juego').style.display === 'none' || e.target.closest('summary')) return;
  const k = e.key.toUpperCase();
  if ('ABCD'.includes(k) && k.length === 1){ const b=document.querySelector(`.opt[data-k="${k}"]`); if(b && !b.disabled) b.click(); }
  if (e.key === 'Enter' && $('#nav').style.display !== 'none') siguiente();
});

$('#foot').innerHTML = DATA.config.pie;
pintarMenu();
</script>
</body></html>
