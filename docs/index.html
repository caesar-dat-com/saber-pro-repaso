<style>

:root{
  --bg:#0f1021; --bg2:#1a1b3a; --card:#232450; --txt:#f2f3ff; --dim:#9fa3cf;
  --a:#e2413f; --b:#1368ce; --c:#d89e00; --d:#26890c; --ok:#26890c; --bad:#e2413f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 4px 10px;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.3px}
.pill{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;
  padding:4px 11px;font-size:.78rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--txt)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
.menu{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:20px;margin-top:8px}
.menu h2{margin:0 0 4px;font-size:1.5rem}
.menu p{color:var(--dim);margin:0 0 18px;font-size:.92rem;line-height:1.5}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid.dos{grid-template-columns:1fr 1fr}}
.opt-area{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.chk{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff1a;
  border-radius:12px;padding:11px 13px;font-size:.95rem}
.chk input{width:18px;height:18px;accent-color:#7c6cff}
.chk .n{margin-left:auto;color:var(--dim);font-size:.82rem}
.btn{background:#7c6cff;color:#fff;padding:15px 18px;font-weight:800;font-size:1rem;width:100%}
.btn.sec{background:#ffffff14;color:var(--txt);font-weight:600}
.btn:active{transform:translateY(1px)}
.bar{height:6px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:#7c6cff;transition:width .3s}
.qbox{background:var(--card);border:1px solid #ffffff14;border-radius:20px;padding:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.72rem;padding:3px 9px;border-radius:99px;background:#ffffff14;color:var(--dim)}
.tag.warn{background:#d89e0033;color:#ffd978}
.q{font-size:1.18rem;line-height:1.45;font-weight:700;margin:0 0 16px}
details.ctx{margin:0 0 14px;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:12px}
details.ctx summary{cursor:pointer;padding:11px 14px;font-size:.88rem;color:#b9bdf0;font-weight:600}
details.ctx .body{padding:0 14px 14px;font-size:.9rem;line-height:1.6;color:#dfe1ff;
  max-height:52vh;overflow:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 15px;
  color:#fff;font-size:.97rem;line-height:1.4;width:100%;opacity:.97;transition:.15s}
.opt .k{font-weight:900;flex:0 0 auto;width:22px}
.opt .gr{display:block;width:100%;max-width:430px;margin:8px 0 2px;border-radius:8px;background:#fff}
.opt.A{background:var(--a)} .opt.B{background:var(--b)}
.opt.C{background:var(--c)} .opt.D{background:var(--d)}
.opt:disabled{opacity:.35}
.opt.win{opacity:1;outline:3px solid #fff;transform:scale(1.01)}
.opt.lose{opacity:.3;filter:grayscale(.6)}
.fb{margin-top:16px;border-radius:14px;padding:14px 15px;font-size:.93rem;line-height:1.55;display:none}
.fb.ok{background:#26890c26;border:1px solid #26890c66}
.fb.bad{background:#e2413f26;border:1px solid #e2413f66}
.fb b{display:block;margin-bottom:5px;font-size:1rem}
.fb .why{color:#e8e9ff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:1.5rem;font-weight:800}
.stat .l{font-size:.72rem;color:var(--dim);margin-top:2px}
.foot{color:var(--dim);font-size:.75rem;text-align:center;padding:16px 8px 28px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#000000cc;
  border:1px solid #ffffff22;padding:10px 16px;border-radius:99px;font-size:.85rem;display:none}
details.ctx .body p{margin:0 0 .7em}
details.ctx .body ul,details.ctx .body ol{margin:0 0 .7em;padding-left:1.3em}
details.ctx .body img{display:block;max-width:100%;margin:8px 0;border-radius:8px;background:#fff}
details.ctx .body table{border-collapse:collapse;font-size:.8rem;margin:0 0 .8em;display:block;overflow-x:auto}
details.ctx .body th,details.ctx .body td{border:1px solid #ffffff2a;padding:4px 7px;text-align:left}
details.ctx .nota{font-size:.78rem;color:var(--dim);font-style:italic}
.reloj{font-variant-numeric:tabular-nums}
.reloj.poco{color:#ffd978;border-color:#d89e0066}
.repaso{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.repaso .it{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.5}
.repaso .it .rq{font-weight:700;margin-bottom:4px}
.repaso .it .ra{color:#9ff59a;margin-bottom:4px}
.repaso .it .rt{color:var(--dim)}
.foot a{color:#b9bdf0}
</style></head>

<script>
const DATA = {"config": {"nombre_examen": "Saber Pro 2026-2", "fecha_examen": "2026-10-18", "segundos_por_pregunta": 120, "pie": "Material de práctica hecho por estudiantes, no oficial del ICFES.<br>Tu progreso se guarda solo en este navegador.<br><a href=\"https://github.com/caesar-dat-com/saber-pro-repaso\">Código y banco de preguntas<\/a> · <a href=\"https://github.com/caesar-dat-com/saber-pro-repaso/issues\">¿Viste un error? Repórtalo<\/a>"}, "areas": {"ciudadana": "Competencias Ciudadanas", "lectura": "Lectura Crítica", "razonamiento": "Razonamiento Cuantitativo"}, "contextos": {"ciudadana": [{"titulo": "Participación ciudadana y solidaridad", "resumen": true, "html": "<p>La participación ciudadana en Colombia es <b>un derecho constitucional y a la vez un deber<\/b>. Tiene dos instancias:<\/p>\n<ul>\n<li><b>Participación política<\/b>: puede ser <i>electoral<\/i> (voto en elecciones, referendos, plebiscitos) o <i>no electoral<\/i> (iniciativa legislativa, cabildo abierto). Busca incidir en decisiones políticas.<\/li>\n<li><b>Participación en la sociedad civil<\/b>: intervenir en la vida pública y colectiva para mantener, reformar o transformar la organización social.<\/li>\n<\/ul>\n<p>La <b>solidaridad<\/b> es un principio constitucional del que derivan la igualdad material (art. 13) y los derechos sociales y económicos, con énfasis en población vulnerable (infancia, tercera edad). Se materializa en: elegir con responsabilidad, <b>pagar impuestos<\/b>, hacer veedurías y movilizarse.<\/p>\n<p><b>Tabla 1 del DANE (2022) — razones para no votar, en %<\/b>:<\/p>\n<table><tr><th>Razón<\/th><th>Total<\/th><th>Bogotá<\/th><th>Caribe<\/th><th>Oriental<\/th><th>Central<\/th><th>Pacífica<\/th><th>Cauca<\/th><\/tr><tr><td>Desinterés<\/td><td>37,2<\/td><td>40,6<\/td><td>31,3<\/td><td>29,2<\/td><td><b>41,7<\/b><\/td><td>41,5<\/td><td>31,6<\/td><\/tr><tr><td>Políticos corruptos<\/td><td>32,9<\/td><td>34,1<\/td><td>18<\/td><td>34,7<\/td><td><b>41<\/b><\/td><td>32,8<\/td><td>22,9<\/td><\/tr><tr><td>Prometen y no cumplen<\/td><td>32<\/td><td>31,3<\/td><td>21,3<\/td><td>34<\/td><td><b>37,9<\/b><\/td><td>33,1<\/td><td>25,1<\/td><\/tr><tr><td>Falta credibilidad electoral<\/td><td>27,2<\/td><td>28,9<\/td><td>16,2<\/td><td>29,5<\/td><td><b>31,1<\/b><\/td><td>28,4<\/td><td>20,2<\/td><\/tr><tr><td>Faltó inscribir cédula<\/td><td>26,7<\/td><td>24,5<\/td><td>29,4<\/td><td><b>31,3<\/b><\/td><td>23,5<\/td><td>26,6<\/td><td>31,9<\/td><\/tr><\/table>"}, {"titulo": "Conflicto armado y control territorial", "resumen": true, "html": "<p>El conflicto transformó los territorios por <b>desplazamiento forzado y despojo<\/b>, profundizando la concentración de la tierra. Tres hechos encadenados:<\/p>\n<ol>\n<li><b>Contrarreforma agraria<\/b> — concentración de tierra como fuente de riqueza y poder.<\/li>\n<li><b>Urbanismo por la fuerza<\/b> — las ciudades crecen de golpe por población desplazada (ciudades receptoras, ciudades refugio), exponiendo a los jóvenes a la criminalidad de la guerra.<\/li>\n<li><b>Disputa armada por el poder local<\/b>, como efecto colateral de la descentralización.<\/li>\n<\/ol>\n<p>Medina (2010): los caciques electorales ya saqueaban los presupuestos antes de la elección popular de alcaldes; <b>tras la Constitución de 1991 esto se profundiza<\/b> porque el narcotráfico penetra los territorios, corrompe élites locales y se instala en el imaginario popular con obras de \"bienestar\".<\/p>"}, {"titulo": "Filosofía de la noviolencia", "resumen": true, "html": "<p>La noviolencia aporta <b>principios, argumentos y métodos prácticos<\/b> sobre acción social, política y poder. Se construye en un mundo pluralizado <b>entre saberes y conocimientos<\/b>, y busca sociedades más pacíficas donde sea posible la <b>regulación de los conflictos<\/b>.<\/p>\n<p>Lo que la desdibuja: utopía, pasividad, impracticabilidad, falta de poder, aquiescencia política, ineficacia, ingenuidad, indiferencia.<\/p>\n<ul>\n<li><b>Gandhi<\/b>: <i>ahimsa<\/i> (no matar, no causar daño) y <i>satyagraha<\/i> (fuerza de la verdad y la justicia).<\/li>\n<li><b>Galtung y Curle<\/b>, influidos por el budismo: paz como <b>desarrollo humano<\/b>; estudio de las raíces profundas del conflicto.<\/li>\n<\/ul>"}, {"titulo": "Economía colombiana (Banco Mundial, 2023)", "resumen": true, "html": "<p>Colombia creció por <b>acumulación de factores (trabajo y capital)<\/b>, no por productividad, y no aprovechó innovación, inversión ni exportaciones.<\/p>\n<p>Composición del PIB 2020: sector primario — minería 5,4 % y <b>agricultura 6,1 %<\/b>; industria <b>18 %<\/b>; servicios <b>68 %<\/b>. Empleo: agricultura 16 %, industria 18 % (estancada), servicios dos tercios y de bajo valor agregado.<\/p>\n<p>Por qué cuesta reducir pobreza y desigualdad:<\/p>\n<ul>\n<li>Primario: concentración de la tierra, poca diversidad, <b>productividad baja<\/b>, deforestación. La minería usa alta tecnología y <b>genera poco empleo<\/b>.<\/li>\n<li>Secundario: <b>desindustrialización<\/b> paulatina, cierre de fábricas.<\/li>\n<li>Terciario: poder en los grupos financieros, <b>controlado por muy pocas personas<\/b>, servicios de bajo valor agregado.<\/li>\n<\/ul>"}, {"titulo": "Constitución de 1991 frente a la discriminación", "resumen": true, "html": "<p>Nació del movimiento <b>Séptima Papeleta<\/b>; reemplazó la de 1886. Amplió derechos (fundamentales; económicos, sociales y culturales; colectivos y del ambiente) y creó <b>garantías procesales<\/b>: acción de tutela, acción popular, acción de cumplimiento y acción de grupo.<\/p>\n<ul>\n<li><b>Indígenas y afrodescendientes<\/b>: art. 8 (diversidad étnica y cultural), arts. 171 y 176 (representación mínima en el Congreso), art. 246 (jurisdicción especial indígena), art. 329 (resguardos: propiedad colectiva no enajenable), art. 55 y Ley 70 de 1993 (tierras colectivas en el Pacífico).<\/li>\n<li><b>Comunidad LGBT<\/b>: art. 13 (igualdad, no discriminación por sexo u orientación sexual, medidas en favor de grupos discriminados); Ley 54 (uniones maritales de hecho); sentencias C-075 y C-811 de 2007 y C-336 de 2008 (derechos patrimoniales, salud, pensión de sobreviviente).<\/li>\n<\/ul>"}, {"titulo": "La paz como derecho humano (masacre de Bojayá)", "resumen": true, "html": "<p>Bojayá, 2 de mayo: un cilindro bomba de las FARC cayó en la capilla San Pablo Apóstol donde se refugiaban 300 personas. <b>117 muertos, 48 de ellos niños<\/b>, de 1.100 habitantes — el 10 % de un pueblo humilde y olvidado. 114 heridos.<\/p>\n<p>En Colombia la paz se reconoce \"como un derecho y un deber de obligatorio cumplimiento\", pero <b>el reconocimiento jurídico no basta<\/b> frente a la precariedad de las condiciones materiales (Condiza, 2012).<\/p>\n<p>Dos concepciones:<\/p>\n<ul>\n<li><b>Paz negativa<\/b>: antropología pesimista y posesiva — el ser humano egoísta, insolidario, individualista. Se define por la <b>ausencia de violencia<\/b> (directa y estructural), el orden y la tranquilidad.<\/li>\n<li><b>Paz positiva<\/b>: optimismo antropológico — el ser humano cooperador, solidario, altruista. Se expresa \"mediante la construcción de un orden en el que exista la justicia social y la total realización de los derechos humanos\" (Harto de Vera, 2016).<\/li>\n<\/ul>"}], "lectura": [{"titulo": "Memorias de una joven formal", "html": "<p>Memorias de una joven formal<\/p>\n<p>Simone de Beauvoir<\/p>\n<p>Comer no era solamente una exploración y una conquista sino el más serio de mis deberes. \"Una cucharada para mamá, una para abuelita... si no comes no crecerás.\" Me ponían contra la pared del vestíbulo, trazaban al ras de mi cabeza una raya que confrontaban con otra más antigua: tenía dos o tres centímetros más, me felicitaban, yo me enorgullecía; a veces, sin embargo, me asustaba. El sol acariciaba el piso encerado y los muebles pintados de blanco. Yo miraba el sillón de mamá y pensaba: \"Ya no podré sentarme sobre sus rodillas.\" De pronto el porvenir existía; me transformaría en otra, qué diría yo, y ya no sería yo. Presentí todos los rompimientos, los renunciamientos, los abandonos, y la sucesión de mis muertos.<\/p>\n<p>Seguí creciendo y me sabía condenada al destierro: buscaba auxilio en mi imagen. Por la mañana enroscaba mi pelo alrededor de un palo y miraba con satisfacción en el espejo mi rostro encuadrado de largos rizos: las morenas de ojos claros no son, según me habían dicho, una especie común y yo ya había aprendido a considerar preciosas las cosas singulares. Me gustaba a mí misma y me gustaba gustar. Los amigos de mis padres alentaban mi vanidad: me alababan cortésmente, me mimaban. Yo me acariciaba contra las pieles, contra los vestidos sedosos de las mujeres; respetaba más a los hombres, sus bigotes, su olor a tabaco, sus voces graves, sus brazos que me levantaban del suelo. Me importaba particularmente interesarles: tonteaba, me agitaba, acechando la palabra que me arrancaría de mis limbos y me haría existir, de veras, en el mundo de ellos. Una noche ante un amigo de mi padre rechacé con terquedad un plato de ensalada cocida. Sobre una tarjeta postal enviada durante las vacaciones él preguntó con ingenio: \"¿Siempre le gusta a Simone la ensalada cocida?\" La letra escrita tenía a mis ojos aún más prestigio que la palabra: yo exultaba. Cuando nos encontramos con el señor Dardelle en el atrio de Notre Dame des Champs, yo esperé bromas deliciosas; intenté provocarlas: no hubo eco. Insistí; me hicieron callar. Descubrí con despecho lo efímero de la gloria. Por lo general esas decepciones me eran evitadas. En casa el menor acontecimiento suscitaba vastos comentarios; escuchaban con gusto mis historias, repetían mis frases. Abuelos, tíos, tías, primos, una abundante familia me garantizaba mi importancia. Además, todo un pueblo sobrenatural se inclinaba sobre mí con solicitud. En cuanto supe caminar mamá me llevó a la iglesia; me había mostrado de cera, de yeso, pintadas sobre las paredes, imágenes del niño Jesús, de tata Dios, de la Virgen, de los ángeles, uno de los cuales estaba como Louise, especialmente afectado a mi servicio. Mi cielo estaba estrellado de una constelación de ojos benévolos.<\/p>\n<p>Referencia<\/p>\n<p>Beauvoir, S. (2018). Memorias de una joven formal. Barcelona: Edhasa.  http://www.diariofemenino.com.ar/documentos/Memorias_deunajovenformal.pdf<\/p>"}, {"titulo": "ELOGIO DE LA DIFICULTAD", "html": "<p>ELOGIO DE LA DIFICULTAD<\/p>\n<p>ESTANISLAO ZULETA<\/p>\n<p>La pobreza y la impotencia de la imaginación nunca se manifiestan de una manera tan clara como cuando se trata de imaginar la felicidad. Entonces comenzamos a inventar paraísos, islas afortunadas, países de Cucaña. Una vida sin riesgos, sin lucha, sin búsqueda de superación y sin muerte. Y por lo tanto también sin carencias y sin deseo: un océano de mermelada sagrada, una eternidad de aburrición. Metas afortunadamente inalcanzables, paraísos afortunadamente inexistentes.<\/p>\n<p>Todas estas fantasías serían inocentes e inocuas, si no fuera porque constituyen el modelo de nuestros propósitos y de nuestros anhelos en la vida práctica.<\/p>\n<p>Aquí mismo, en los proyectos de la existencia cotidiana, más acá del reino de las mentiras eternas, introducimos también el ideal tonto de la seguridad garantizada, de las reconciliaciones totales, de las soluciones definitivas. Puede decirse que nuestro problema no consiste sola ni principalmente en que no seamos capaces de conquistar lo que nos proponemos, sino en aquello que nos proponemos; que nuestra desgracia no está tanto en la frustración de nuestros deseos, como en la forma misma de desear. Deseamos mal. En lugar de desear una relación humana inquietante, compleja y perdible, que estimule nuestra capacidad de luchar y nos obligue a cambiar, deseamos un idilio sin sombras y sin peligros, un nido de amor y, por lo tanto, en última instancia un retorno al huevo. En lugar de desear una sociedad en la que sea realizable y necesario trabajar arduamente para hacer efectivas nuestras posibilidades, deseamos un mundo de la satisfacción, una monstruosa salacuna de abundancia pasivamente recibida. En lugar de desear una filosofía llena de incógnitas y preguntas abiertas, queremos poseer una doctrina global, capaz de dar cuenta de todo, revelada por espíritus que nunca han existido o por caudillos que desgraciadamente sí han existido.<\/p>\n<p>Adán y sobre todo Eva tienen el mérito original de habernos liberado del paraíso, nuestro pecado es que anhelamos regresar a él.<\/p>\n<p>Desconfiemos de las mañanas radiantes en las que se inicia un reino milenario. Son muy conocidos en la historia, desde la antigüedad hasta hoy, los horrores a los que pueden y suelen entregarse los partidos provistos de una verdad y de una meta absolutas, las iglesias cuyos miembros han sido alcanzados por la gracia —por la desgracia— de alguna revelación. El estudio de la vida social y de la vida personal nos enseña cuán próximos se encuentran una de otro la idealización y el terror. La idealización del fin, de la meta y el terror de los medios que procurarán su conquista. Quienes de esta manera tratan de someter la realidad al ideal, entran inevitablemente en una concepción paranoide de la verdad; en un sistema de pensamiento tal que los que se atrevieran a objetar algo quedan inmediatamente sometidos a la interpretación totalitaria: sus argumentos, no son argumentos, sino solamente síntomas de una naturaleza dañada o bien máscaras de malignos propósitos. En lugar de discutir un razonamiento se le reduce a un juicio de pertenencia al otro —y el otro es, en este sistema, sinónimo de enemigo— o se procede a un juicio de intenciones. Y este sistema se desarrolla peligrosamente hasta el punto en que ya no solamente rechaza toda oposición, sino también toda diferencia: el que no está conmigo está contra mí, y el que no está completamente conmigo, no está conmigo.<\/p>\n<p>Referencia<\/p>\n<p>Zuleta, E. (1980) Elogio de la dificultad.<\/p>"}, {"titulo": "UN POCO DE ESTRÉS ES BUENO", "html": "<p>UN POCO DE ESTRÉS ES BUENO<\/p>\n<p>MARK A. GLUCK, eDUARDO MERCADO Y CATHERINE E. MYERS<\/p>\n<p>Para ingresar a la universidad, Moe, Larry y Curly deben presentar una prueba de aptitud, diferente a la de conocimiento, competencia o desempeño. Esta prueba de aptitud (SAT), constituye una experiencia estresante para ellos, pero cada uno reacciona de manera diferente.<\/p>\n<p>Larry ya casi obtuvo la aceptación anticipada tanto a Princeton como a Harvard, por lo que está bastante relajado al presentar el examen. Moe está más nervioso, sus calificaciones son buenas, pero no espectaculares como para ingresar a Berkeley o a MIT y una puntación alta en el SAT lo ayudaría a ser aceptado en la universidad que quiere. Mientras que Curly está aterrado, sus calificaciones son pésimas y su única oportunidad de ingresar en una universidad decente es sobresalir en el SAT. Si suponemos (de manera ficticia) que los tres estudiantes tienen igual conocimiento al presentar el examen ¿cuál de ellos tendrá un mejor desempeño?<\/p>\n<p>Como tal vez resulta evidente, Curly se encuentra en desventaja; está tan estresado que puede olvidar todo lo que sabe en cuanto vea la primera pregunta. Quizá sea menos obvio que también Larry está en desventaja: no es bueno estar demasiado relajado. Un poco de estrés es bueno para la memoria y esto se aplica tanto para el recuerdo (presentar la prueba) como a la codificación (aprendizaje inicial). El estrés moderado ocasiona la liberación de las hormonas del estrés, como la epinefrina y los glucocorticoides. El hipocampo tiene una concentración particularmente alta de receptores de glucocorticoides, y bajos niveles de las hormonas del estrés facilitan la potenciación a largo plazo (PLP) y fomentan el crecimiento dendrítico, lo que mejora la formación de la memoria y el recuerdo. Por lo tanto, Moe debería beneficiarse de su leve ansiedad durante la presentación del SAT.<\/p>\n<p>Por desgracia, aunque los niveles bajos de estrés pueden mejorar la memoria, los niveles altos crónicos de estrés dañan el recuerdo de la información aprendida antes. La relación entre activación y aprendizaje de hábitos que se suele representar en forma de U invertida se conoce como curva de Yerkes-Dodson en honor a dos investigadores que la encontraron. La relación se sostiene para el estrés y para el hipocampo. Aunque los niveles bajos de las hormonas del estrés facilitan el aprendizaje hipocampal, los niveles altos pueden sobreexcitar el hipocampo e interferir con el aprendizaje y el recuerdo. Incluso es posible que la exposición a largo plazo a altos niveles de estrés ocasione muerte neuronal en el hipocampo, en cuyo caso el daño a la memoria puede ser permanente.<\/p>\n<p>¿Qué desencadena la transición de la mejoría de la memoria (en niveles bajos de estrés) al daño hipocampal (en niveles altos)? Dicho de otra manera, ¿cuánto estrés es demasiado? Por desgracia, no existe una respuesta sencilla: cada individuo parece tener un límite distinto. Todos conocemos personas (como los agentes de la bolsa y enfermeras de salas de urgencias) quienes les sientan de maravilla las condiciones estresantes mientras otras se desmoronan con el menor inconveniente. Cada persona debe aprender la medida de su tolerancia al estrés. Existen métodos para reducir el estrés como la meditación, el yoga, la oración o el ejercicio. Estas técnicas ofrecen un escape temporal a las vicisitudes de la vida diaria, si se practican cotidianamente pueden producir beneficios médicos. Pueden lograr que el hipocampo al rango normal de operación.<\/p>\n<p>Referencia<\/p>\n<p>Gluck M., Mercado, E.,Myers, C. (2008) \"Un poco de estrés es bueno”, en Aprendizaje y memoria. Del cerebro al comportamiento. McGrawHill.<\/p>"}, {"titulo": "LO QUE NO TIENE NOMBRE", "html": "<p>LO QUE NO TIENE NOMBRE<\/p>\n<p>Piedad Bonett<\/p>\n<p>Reviso uno a uno los libros y los cuadernos. En el fondo de mi corazón suplico porque aparezca un diario, una nota de carácter personal. Pero sólo hay trabajos críticos o notas de clase, escritas con letra pequeña, apretada, minuciosa (...).<\/p>\n<p>Camila abre los cajones de la cómoda y saca camisas y medias. Dentro de un par encuentra un rollito de dólares, metido ahí para preservarlos de un posible intruso. Entonces Rafael, mi marido, nos hace notar lo que acaba de descubrir: cuidadosamente alineados sobre el escritorio están el reloj, la billetera, el iPod, el teléfono móvil. Los ojos se nos llenan de lágrimas.<\/p>\n<p>Cuando salimos con las maletas cargadas, se abre la puerta del apartamento vecino, y dos ancianos muy ajados, que evidentemente han estado esperando algún ruido nuestro para salir, nos dan un ramito de flores y una tarjeta, y nos abrazan, conmovidos. En ese momento aparece en el descanso de la escalera una pareja con un niño; se detienen, con timidez. También ellos lo sienten mucho. La mujer, una rubia joven, de semblante amable, nos dice que ella estaba allí a la hora de la tragedia y que lo oyó correr. Mi hija Camila se asombra, se adelanta:<\/p>\n<p>¿lo oíste correr?, ¿dónde estabas?<\/p>\n<p>En su piso, el último. Desde ahí oyó un tropel de pasos en el techo. Entonces todo termina de aclararse: la ventana abierta, la escalera de incendios que trepa hasta el techo del edificio. Daniel murió en Nueva York el sábado 14 de mayo de 2011, a la una y diez de la tarde. Acababa de cumplir veintiocho años y llevaba diez meses estudiando una maestría en la Universidad de Columbia. Renata, mi hija mayor, me dio la noticia por teléfono dos horas después, con cuatro palabras, de las cuales la primera, pronunciada con voz vacilante, consciente del horror que desataría del otro lado, fue, claro está, mamá.<\/p>\n<p>Las tres restantes daban cuenta, sin ambages ni mentiras piadosas, del hecho, del dato simple y llano de que alguien infinitamente amado se ha ido para siempre, no volverá a mirarnos ni a sonreímos.<\/p>\n<p>Pero la fuerza de los hechos es incontestable: «Daniel se mató» sólo quiere decir eso, sólo señala un suceso irreversible en el tiempo y el espacio, que nadie puede cambiar con una metáfora o con un relato diferente.<\/p>\n<p>Referencia:<\/p>\n<p>Adaptado de: Bonnett, P. (2013), Lo que no tiene nombre, España, Alfaguara. Recuperado de: https://www.serlib.com/pdflibros/9788420414980.pdf<\/p>"}, {"titulo": "LA GUERRA", "html": "<p>LA GUERRA<\/p>\n<p>Estanislao Zuleta<\/p>\n<p>Los diversos tipos de pacifismo hablan abundantemente de los dolores, las desgracias y las tragedias de la guerra — y esto está muy bien, aunque nadie lo ignora —; pero suelen callar sobre ese otro aspecto tan inconfesable y tan decisivo, que es la felicidad de la guerra. Porque si se quiere evitar al hombre el destino de la guerra hay que empezar por confesar, serena y severamente la verdad: la guerra es fiesta. Fiesta de la comunidad al fin unida con el más entrañable de los vínculos, del individuo al fin disuelto en ella y de sus intereses; capaz de darlo todo, hasta su vida. Fiesta de poderse aprobar sin sombras y sin dudas frente al perverso enemigo, de creer tontamente tener la razón, y de creer más tontamente aún que podemos dar testimonio de la verdad con nuestra sangre.<\/p>\n<p>Si esto no se tiene en cuenta, la mayor parte de las guerras parecen extravagantemente irracionales, porque todo el mundo conoce de antemano la desproporción existente entre el valor de lo que se persigue y el valor de lo que se está dispuesto a sacrificar. Cuando Hamlet se reprocha su indecisión en una empresa aparentemente clara como la que tenía ante sí, comenta: \"Mientras para vergüenza mía veo la destrucción inmediata de veinte mil hombres que, por un capricho, por una estéril gloria van al sepulcro como a sus lechos, combatiendo por una causa que la multitud es incapaz de comprender, por un terreno que no es suficiente sepultura para tantos cadáveres\". ¿Quién ignora que este es frecuentemente el caso? Hay que decir que las grandes palabras solemnes: el honor, la patria, los principios, sirven casi siempre para racionalizar el deseo de entregarse a esa borrachera colectiva.<\/p>\n<p>Si alguien me objetara que el reconocimiento previo de los conflictos y las diferencias, de su inevitabilidad y su conveniencia, arriesgaría paralizar en nosotros la decisión y el entusiasmo en la lucha por una sociedad más justa, organizada y racional, yo le replicaría que para mí una sociedad mejor es una sociedad capaz de tener mejores conflictos. De reconocerlos y de contenerlos. De vivir no a pesar de ellos, sino productiva e inteligentemente en ellos. Que sólo un pueblo escéptico sobre la fiesta de la guerra, maduro para el conflicto, es un pueblo maduro para la paz.<\/p>\n<p>Referencia:<\/p>\n<p>Adaptado: Zuleta, E. (2015, enero – marzo). Sobre la guerra. Revista Universidad de Antioquia, (319), Recuperado de: https://aprendeenlinea.udea.edu.co/revistas/index.php/revistaudea/article/view/22402/18546<\/p>"}, {"titulo": "EL PRINCIPIO DE LA DISTRIBUCIÓN DESIGUAL", "html": "<p>EL PRINCIPIO DE LA DISTRIBUCIÓN DESIGUAL<\/p>\n<p>Jordan Petersone<\/p>\n<p>Cuando una langosta derrotada recupera la moral y se atreve a volver a pelear, sus probabilidades de perder son mayores según su historial de batallas acumuladas. Por el contrario, la ganadora tiene más probabilidades de ganar. Además, en el mundo de las langostas se juega el doble o nada a favor del ganador,  que en las sociedades humanas, donde el uno por ciento más rico cuenta con las mismas riquezas que si se sumaran las riquezas del 50% de más abajo y las ochenta y cinco personas más ricas tienen lo mismo que los 3.500 millones que ocupan la parte inferior.<\/p>\n<p>Este principio de distribución desigual se reproduce fuera del ámbito financiero; de hecho, en cualquier parte donde se requiera una producción creativa. La mayor parte de los artículos científicos los publica un grupo muy reducido de investigadores. Apenas un puñado de autores vende todos los libros, tan solo una minúscula proporción de músicos produce la totalidad de la música comercial que llega a grabarse. Igualmente, solo cuatro compositores clásicos escribieron casi toda la música que hoy tocan las orquestas modernas. Así pues, sólo una pequeña parte de músicos clásicos produjo la mayor cantidad de música clásica de toda la historia que el mundo conoce y aprecia.<\/p>\n<p>A este principio se le suele llamar “Ley de Price”, en honor a Derek J. De Solla Price, quien la descubrió en 1963. Pero, este principio fue descubierto antes. El polímata italiano Vilfredo Pareto advirtió su aplicación a la distribución de la riqueza a principios del siglo XX, y parece funcionar de forma apropiada para cualquier sociedad posible. Se aplica también a la población de las ciudades, la masa de los cuerpos celestes, la frecuencia de palabras de una lengua, entre otras muchas cosas.<\/p>\n<p>Por último, volviendo a las langostas, a ellas no les hace falta tantear mucho para saber con quién pueden meterse y a quién es mejor evitar. Y una vez que lo saben, la jerarquía resultante es extremadamente estable. Después de ganar la vencedora solo tiene que sacudir sus antenas amenazantemente y la antigua rival se esfumara. Una langosta debilitada no se revelará, aceptará su estatus inferior y mantendrá las patas pegadas al cuerpo. Contrariamente, la langosta que ocupa la posición superior se jactará de su dominación sobre el territorio sacando a las langostas subordinadas de sus refugios durante la noche tan solo para recordarles quien es la que manda.<\/p>\n<p>Referencia:<\/p>\n<p>Adaptado: Peterson, J. (2019). 12 reglas para vivir. Antídoto al caos. Editorial Planeta. Recueperado de: https://leerlibrosonline.net/leer-12-reglas-para-vivir-de-jordan-b-petersone/<\/p>"}], "razonamiento": [{"titulo": "Fijación de carbono asociado a la biomasa", "html": "<p>Fijación de carbono asociado a la biomasa<\/p>\n<p>La biomasa se refiere a la cantidad total de materia orgánica presente en los seres vivos. La biomasa del planeta presente en las plantas es el 80%, el 15% en las bacterias, el 1% en las arqueas, el 0,3% en los animales y el resto en hongos y virus. En los árboles y las palmas, la biomasa se refiere específicamente a la cantidad de materia orgánica almacenada en sus tejidos, como troncos, raíces y hojas.<\/p>\n<p>La medición y estimación de la biomasa arbórea pueden realizarse a través de diversos métodos, como inventarios forestales, análisis de imágenes de satélite, modelos matemáticos (métodos alométricos), métodos de muestreo destructivo, tecnología de imágenes y muestreo no destructivo.<\/p>\n<p>Con el propósito de determinar y comparar la fijación de carbono asociado a la biomasa aérea, de raíces en las especies arbóreas leñosas y monocotiledóneas de la UAO, se usó la información suministrada por la CVC-DAGMA-UAO del censo arbóreo de Cali, en el cual se encontró que el número de especies arbóreas en la UAO es de 261 árboles y palmas, entre ellos: 182 palmas de la familia arecaceae, 22 árboles de la familia fabaceae, 14 árboles de la familia strelitziaceae (Tabla 1).<\/p>\n<p>Tabla 1<\/p>\n<p>Biomasa total de familias arbóreas más abundantes en la UAO.<\/p>\n<p>Familia<\/p>\n<p>Cantidad<\/p>\n<p>Biomasa tronco (Kg)<\/p>\n<p>Biomasa área (Kg)<\/p>\n<p>Biomasa Total (Kg)<\/p>\n<p>Arecaceae<\/p>\n<p>182<\/p>\n<p>38998<\/p>\n<p>21378<\/p>\n<p>60147<\/p>\n<p>Bignoniaceae<\/p>\n<p>9<\/p>\n<p>4955<\/p>\n<p>2865<\/p>\n<p>7821<\/p>\n<p>Cycadaceae<\/p>\n<p>5<\/p>\n<p>463<\/p>\n<p>692<\/p>\n<p>1154<\/p>\n<p>Fabaceae<\/p>\n<p>22<\/p>\n<p>11790<\/p>\n<p>8788<\/p>\n<p>20578<\/p>\n<p>Strelitziaceae<\/p>\n<p>14<\/p>\n<p>2415<\/p>\n<p>694<\/p>\n<p>3109<\/p>\n<p>Total general<\/p>\n<p>232<\/p>\n<p>58621<\/p>\n<p>34417<\/p>\n<p>92810<\/p>\n<p>Fuente: Largo B. (2017). Biomasa y fijación de carbono en el campus de la UAO, calculada a partir de la ecuación propuesta por (Brown et al.1989) y (Sierra, et al 2003) considerando parámetros como la altura, diámetro a la altura del pecho, densidad y número de tallos. Universidad Autónoma de Occidente.<\/p>\n<p>Con los datos arrojados de la investigación, se realizó una curva de ajuste, para observar la relación entre la Biomasa total y el diámetro a la altura del pecho (DAP) (Gráfico 1).<\/p>\n<p>Gráfico 1.<\/p>\n<p>Biomasa total vs DAP<\/p>\n<p>Fuente: Tesis Administración Ambiental (2017). UAO<\/p>\n<p>Otro objetivo de la investigación es determinar la fijación de carbono mediante el proceso de fotosíntesis por las especies arbóreas del campus de la UAO (Tabla 2).<\/p>\n<p>Tabla 2<\/p>\n<p>Fijación de carbono por familias arbóreas más abundantes de la UAO.<\/p>\n<p>Familia<\/p>\n<p>Cantidad<\/p>\n<p>Promedio (Kg)<\/p>\n<p>Desviación estándar<\/p>\n<p>Coeficiente de variación<\/p>\n<p>Arecaceae<\/p>\n<p>182<\/p>\n<p>158,6<\/p>\n<p>262,8<\/p>\n<p>166%<\/p>\n<p>Bignoniaceae<\/p>\n<p>9,0<\/p>\n<p>418,0<\/p>\n<p>304,8<\/p>\n<p>73%<\/p>\n<p>Cycadaceae<\/p>\n<p>5,0<\/p>\n<p>112,7<\/p>\n<p>18,3<\/p>\n<p>16%<\/p>\n<p>Fabaceae<\/p>\n<p>22,0<\/p>\n<p>451,6<\/p>\n<p>1.024,6<\/p>\n<p>227%<\/p>\n<p>Strelitziaceae<\/p>\n<p>14,0<\/p>\n<p>105,9<\/p>\n<p>79,1<\/p>\n<p>75%<\/p>\n<p>Total general<\/p>\n<p>232<\/p>\n<p>192,1<\/p>\n<p>408,8<\/p>\n<p>213%<\/p>\n<p>Fuente: Tesis Administración Ambiental (2017). UAO<\/p>\n<p>Referencia<\/p>\n<p>Largo, B. (2017). Biomasa y fijación de carbono en el campus de la UAO. Universidad Autónoma de Occidente<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtMAAAFoCAYAAACVEXcaAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AAFhuSURBVHhe7b2Pdxxnla57/02DADOYM4A9B+5kEOOcc8OMB4ZDvLwyKwfPDZzExiiJbRxgTAzJwQmMDQKucsM4N7JkR/lhkBOj4EliA8EOWtT1ru7dqq6uqq4f36v+uvt51trL7uqvq7ZebXW9/fWur/6Pq1evfuVeJARBEARBEARB1I9XXnnluJnpwicJgiAIgiAIgqiOgZkGAAAAAIB6YKYBAAAAAFqCmQYAAAAAaAlmGgAAAACgJZhpAAAAAICWYKYBAAAAAFqCmQYAAAAAaAlmGgAAAACgJZhpAAAAAICWYKYBAAAAAFqCmQYAAAAAaAlmGgAAAACgJZhpAAAAAICWYKYBAAAAAFqCmQYAAAAAaElwM3337t3kwIEDyZ49ewaxsLCQbGxs9EdUs7q6mhw6dCh93eLiYunrQo8DAAAAAGhKcDP9k5/8ZGCiPY4cOdJ/tpr19fXUeK+srKSPzQjv ntra una persona por el hecho de ser del género femenino (ONU Mujeres, 2023).<\/p>\n<p>En Colombia, el número de feminicidios por departamentos señala que entre 2018 y 2022, se registraron feminicidios en veintinueve departamentos del país. El número de feminicidios en Antioquia es 420, encabezando la lista, seguido del Valle del Cauca con 349 y en el tercer lugar está Bogotá D.C. con 195, seguido de Cauca con 168 y Norte de Santander con 127, entre otros.<\/p>\n<p>En 2022 se registraron 47.771 casos de mujeres víctimas de violencia intrafamiliar, cifra que, en comparación con el 2021, presentó un aumento de 7.713 casos. El reporte de exámenes medicolegales por presunto delito sexual en mujeres aumentó en 3.650 casos en el 2022, frente a lo reportado en el 2021. En lo corrido del 2023, se han registrado 3.483 casos de violencia intrafamiliar y 1.516 exámenes medicolegales efectuados por presunto delito sexual.<\/p>\n<p>Según el Observatorio de Feminicidios en Colombia entre enero de 2018 y marzo de 2023, el promedio mensual de feminicidios fue de 51 mujeres. Así mismo, el mayor número de mujeres asesinadas categorizadas como feminicidios, fue en septiembre en 2020, con un total de 85 mujeres. De manera acumulada, el 2019 representó un total de 665 mujeres víctimas de feminicidio, en el 2020, 571 mujeres, en 2021 fue de 622 mujeres, en el 2022 fue de 612 mujeres y entre enero y septiembre de 2023 ha sido de 132 mujeres.<\/p>\n<p>Entre el 24 de marzo y el 26 de octubre de 2020, se registraron 143 feminicidios en Colombia, según estadísticas del Sistema Integrado de Información sobre Violencias de Género, del Ministerio de Salud. En contraste, las organizaciones de mujeres aportan una cifra más alta: el Observatorio Feminicidios Colombia contabilizó 271 asesinatos por motivos de género entre marzo y agosto, durante el confinamiento obligatorio 2020-2021.<\/p>\n<p>Gráfico 2<\/p>\n<p>Número de feminicidios en Colombia en 2020.<\/p>\n<p>Fuente: Elaboración propia con datos del Observatorio Colombiano de las Mujeres (2020).<\/p>\n<p>Analizado por grupos etarios, se evidencia que las mujeres víctimas de feminicidio en Colombia, para los cuatro años de referencia, se concentran entre 20 y 24 años. Un aspecto que llama la atención es la existencia de una gran cantidad de registros en los cuales no se tienen datos con respecto a la edad (Gráfico 3).<\/p>\n<p>Gráfico 3.<\/p>\n<p>Rango de edad de feminicidios en Colombia. Enero 2019 – diciembre 2022<\/p>\n<p>Fuente: Observatorio Feminicidios Colombia (2022).<\/p>\n<p>Referencia<\/p>\n<p>Gélvez Rubio, T., Rozo Romero, C. (2023). El feminicidio en Colombia: La tarea pendiente de las cifras que aún no hemos calculado. Investigación UEC. https://www.uexternado.edu.co/investigacion-uec/el-feminicidio-en-colombia-la-tarea-pendiente-de-las-cifras-que-aun-no-hemos-calculado/#:~:text=Feminicidios%20en%20Colombia%3A%20un%20panorama%20desolador&amp;text=De%20manera%20acumulada%2C%20el%202019,ha%20sido%20de%20132%20mujeres.<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAngAAAF8CAYAAABc7saxAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AAIz2SURBVHhe7Z0JfFTV2YetXbS1rW3VqnW3tW5trdVW/VqrVru4YFVAcUHccBf3XSu477ghu4DIvqOAICKr7CBkTwgJCSRhS0ggJCHA+81z5t4wDANCMsDcyf/p7zTMmZs4d+695/zPu519srKy+mRnZ1tGRoalp6erqampqampqakFsKHlQrrOQrpuNALPcnNzbdmyZWpqampqampqagFuaDq03T6ovaKiIhNCCCGEEMEGTYc1bx/+D8UnhBBCCCGCDZpOAk8IIYQQIomQwBNCCCGESDIk8IQQQgghkgwJPCGEEEKIJEMCTwghhBDbZcqUKXbLLbdYy5Yt7dFHH7W8vDzvna355JNPrHXr1nWtR48etmnTJu9dsaeRwBNCCCFETAYOHGgXXHCBvfjiizZgwAC777777MILL7R58+Z5R4RB9J1yyim2zz771LX//e9/tnnzZu8IsaeRwBNCCCHENpSVldn5559v7dq183rM1q1bZ3/961/t/vvv38o699FHH1nbtm2d0KMtXrzYHSv2HhJ4QgghhNiGJUuWOKvc888/7/WEueKKK+zBBx+sE3grV660G2+80Tp16iRRl0BI4AkhhBBiG6qrq+3qq6+2gw46yD799FPXN3bsWDv33HNtxowZ7jV8+OGHdW7Zf//73y4Wr7Ky0ntX7C0aLPC++eYbe+SRR+zWW2+1N954w6qqqrx3toDKHzp0qN122232+uuvS+ELIYQQASA1NdVOO+00+8lPfuLm+ldeecWmTp3qvRtm/Pjxzsp3zTXXbBV/pwSLvUuDBN64cePsoosusqeeesr53y+55BK74YYbnLk2Evz3TZo0s ty2QymUwmk8lkssEZ4rqkpKTx/w/X4X9m6S8EMAAAAABJRU5ErkJggg==\" alt=\"gráfica\">"}, {"titulo": "Costo y asequibilidad de una dieta saludable", "html": "<p>Costo y asequibilidad de una dieta saludable<\/p>\n<p>El costo de una dieta saludable en América del Sur y África influye en el bienestar de sus habitantes. En el 2022, a pesar de la reducción del hambre en Asia y América Latina, esta aumenta en Asia occidental, el Caribe y África. En particular, África enfrenta un desafío significativo, con casi el 20% de su población sufriendo hambre, en comparación con el 8,5% en Asia, el 6,5% en América Latina y el Caribe, y el 7% en Oceanía.<\/p>\n<p>El hambre en el mundo en 2022, medida por la prevalencia de la subalimentación fue superior a los niveles previos a la pandemia. En 2022, aproximadamente el 9,2% de la población mundial sufría de hambre crónica, en contraste con el 7,9% registrado en 2019 (Gráfico 4).<\/p>\n<p>Gráfico 4.<\/p>\n<p>Prevalencia de la subalimentación en el mundo (PSM) (2005-2022).<\/p>\n<p>Fuente: FAO. (2023). FAOSTAT: Conjunto de indicadores de la seguridad alimentaria. En: FAO. [Consultado el 14 de septiembre de 2023]. https://www.fao.org/faostat/es/#data/FS<\/p>\n<p>En América del Sur, el costo de una dieta saludable ha aumentado en los últimos años, dificultando su accesibilidad para muchas personas. El costo promedio diario por persona es de aproximadamente 4,08 dólares, superando el promedio mundial de 3,66 dólares. Aunque existen variaciones en los precios de alimentos según el país, en general, los hogares de la región deben destinar una parte considerable de sus ingresos para mantener una dieta saludable (Gráfico 5).<\/p>\n<p>Gráfico 5.<\/p>\n<p>Costo de una dieta sana por persona y día (DPyD) (2005-2022).<\/p>\n<p>Fuente: FAO. (2023). FAOSTAT: Conjunto de indicadores de la seguridad alimentaria. En: FAO. [Consultado el 14 de septiembre de 2023]. https://www.fao.org/faostat/es/#data/FS<\/p>\n<p>Por otro lado, en África, la situación es aún más desafiante. A pesar de tener un costo promedio de dieta saludable más bajo, alrededor de 3,57 dólares por persona, la asequibilidad se convierte en un problema crítico. En 2021, se reportó que el 78% de la población africana no tenía los recursos necesarios para adquirir una dieta saludable, marcando la proporción más alta en comparación con otras regiones del mundo (Grafico 6).<\/p>\n<p>Gráfico 6.<\/p>\n<p>Población que no puede permitirse una dieta sana (%) (2017-2021).<\/p>\n<p>Fuente: FAO. (2023). FAOSTAT: Conjunto de indicadores de la seguridad alimentaria. En: FAO. [Consultado el 14 de septiembre de 2023]. https://www.fao.org/faostat/es/#data/FS<\/p>\n<p>Esta disparidad en la asequibilidad de las dietas saludables refleja desafíos económicos y sociales en estas regiones. Los aumentos de precios de los alimentos, junto con la disminución de los ingresos disponibles debido a factores como la pandemia de COVID-19, han exacerbado el problema. A nivel mundial, más de 3.100 millones de personas no pueden permitirse una dieta saludable, destacando la importancia de abordar esta cuestión globalmente para mejorar la salud y el bienestar de las poblaciones en América del Sur, África y en todo el mundo.<\/p>\n<p>Referencia<\/p>\n<p>FAO, FIDA, OMS, PMA y UNICEF. (2023). Versión resumida de El estado de la seguridad alimentaria y la nutrición en el mundo 2023. Urbanización, transformación de los sistemas agroalimentarios y dietas saludables a lo largo del continuo rural-urbano. FAO. http://doi.org/10.4060/cc6550es<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtIAAAF5CAMAAACFhz0oAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAALBUExURdnZ2dra2tra2tnZ2QAAAAUFBQYGBgkJCQsLCw4ODhERERgYGBoaGh0dHR4eHiIiIiUlJSYmJigoKCoqKisrKy0tLTIyMjMzMzY2Njo6Oj8/P0BAQEJCQkREREdHR0xMTE1NTVBQUFFRUVNTU1RUVFlZWVqa1Vqb1lua1Vub1Fub1Vub1luc1Vuc1lyb1Vyb1lyc1Vyc1lyd1l1dXV2c1V2c1l2d1l6d1V6d1l6e1l+d1V+e1l+e12Ce1mCe12FhYWJiYmKf1mOf1mSg2GWh2GZmZmag1Wag1mai2GdnZ2ei2Gij2Wmj2Wmk2Wqk2Wtra2uj1WxsbGyl2W1tb >EL DESHIELO EN LOS GLACIARES<\/p>\n<p>CONTEXTO GLOBAL<\/p>\n<p>De acuerdo con un estudio publicado en la revista Nature, desde 1961 los glaciares de nuestro planeta han perdido más de 9.625 gigatoneladas de hielo, (9,6 billones de toneladas de hielo). Todo en un plazo inferior a 50 años, lo que ha provocado un aumento de nivel del mar de 27 milímetros. O lo que es lo mismo, cada año se derrite en todo el mundo tres veces el hielo que cubre los Alpes. Un desastre ambiental con un claro culpable: el calentamiento global.<\/p>\n<p>Hemos de hacer una clara distinción entre los glaciares de montaña y las enormes extensiones de hielo que podemos encontrar en lugares como Groenlandia y la Antártida. El área aproximada de los glaciares de montaña, es      de territorio a nivel mundial, y con un volumen total estimado de 170.000 , tienen el potencial de provocar un aumento del nivel del mar de 0,4 metros.<\/p>\n<p>Según los datos aportados por científicos las mayores pérdidas regionales se han producido en Alaska, seguidas de los glaciares en los márgenes del manto de hielo de Groenlandia y los glaciares del sur de los Andes. También se han perdido cantidades significativas en los glaciares de las regiones árticas canadiense y rusa, así como en el archipiélago de Svalbard. (Figura 1)<\/p>\n<p>Los glaciares en regiones templadas, como los de los Alpes europeos y la cordillera del Cáucaso, tampoco se han librado de esta tendencia, pero son demasiado pequeños como para que sus pérdidas contribuyan a la subida del nivel del mar. También llama la atención que la única área donde el hielo ha aumentado en el periodo de 55 años estudiado, haya sido el suroeste asiático. En esta región, los glaciares ganaron 119 gigatoneladas de hielo. En cambio, los del sureste asiático perdieron aproximadamente la misma cantidad, 112 gigatoneladas. (Figura 1).<\/p>\n<p>Figura 1: Pérdida de masa Glaciar en gigatoneladas de hielo  1961 – 2016.<\/p>\n<p>Elaboración propia<\/p>\n<p>En el mundo, la desaparición de los glaciares implica menos agua para millones de personas, menos energía hidroeléctrica y menos disponibilidad para regar los cultivos. El deshielo de los glaciares provoca el aumento del nivel del mar, pero también hace crecer de forma crítica el riesgo de otras catástrofes naturales, como desbordamientos repentinos de lagos glaciares y el arrastre de residuos que conlleva. Por ello, saber la velocidad a la que los glaciares pierden masa a largo plazo es muy importante para tomar decisiones informadas de cara al futuro.<\/p>\n<p>De acuerdo con la información responda las siguientes cinco preguntas:<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzsAAAJqCAYAAAAMil7JAAAgAElEQVR4Aey9zY8tSXreN7ABaWfYgP0nyIZNGTBBw9ayABEmZcsbLgoYySYNDcEhGyXAEOkP2E1QteCOLYKGUDIlWW0vSA5QsGe0GhCYBUstLylQC8kzBVCbAZcEQe7Ut+89xlPd771xojJPfkXEE5nnl0De/IiI9434xXsi36fyVN2vnRpvP/zhD08/+MEP2GFADBADxAAxQAwQA8QAMUAMXEEMKP93bV9r7VhCh81HAP4+9vIMfx//d+/ewd+H/yT+z8/Pxh5ct+tr4//23RenX3v6eXYYvMTAr/+TO9Z/8xLozH8QO+bJb+3eGWytx9qjP/j7ZgWx42Mvz9eWbHtpv/Z+bfwROwi9VOwidl6vCa3vOPMfxE7r2Tb7cwabeehduIe/bxoQOz728nxtybaX9mvv18YfsYPYQey8Xgecd5z5D2LHOfMG385gMwy3O5fw900JYsfHXp6vLdn20n7t/dr4I3YQO4id1+uA844z/0HsOGfe4NsZbIbhducS/r4pQez42MvztSXbXtqvvV8bf8QOYgex83odcN5x5j+IHefMG3w7g80w3O5cwt83JYgdH3t5vrZk20v7tfdr44/YQewgdl6vA847zvwHseOceYNvZ7AZhtudS/j7pgSx42Mvz9eWbHtpv/bu4n9zc3NK97Rnt7e3Z2Xx1/oeHx/P7qftVTZnQ+wgdhA7cz4p7eo48x/ETrt57sKTM9i6AGDuBPx9E4DY8bGXZ1ey7R11P95b85dwkUgZEycSOvf39+8BPTw8vNR/fyM7CQGU3R69ROwgdhA7ox8PS4Ez/0HsWKbc59QZbL5R9+MZ/r65QOz42Mtz62TbO9r+vLfmLyGTipmcSC6Enp6eLoqdu7u7i/Zy+4gdxA5iJ/9UeK+d+Q9ixzv3zb07g635YDt0CH/fpCB2fOzluXWy7R1tf95b88/FTE5E4kVvd2K7JGZCCMXX3KLNpSNiB7GD2Ln0CWlf5sx/EDvt59vq0Rls1oF34hz+volA7PjYy3PrZNs72v68t+QfX2GTgEl/30ZfVUu3tPzSWyDV075kQ+wgdhA7Sz4x9es68x/ETv357cqDM9i6AmHqDPxN4L9KtuHv5b/kJ/O+nh7Ts0PspOIm3s7oqC0VRPGHCoZ+vyfqRbu5s4PYQewgduZ+WtrUcz5/ETtt5rgbL85g6waCsSPw98HnzY6PvTy3TLa9I+3Tey3+IWLiDY7e0IwJFIkaCaAoT8VN/AGCXNTIXvp1t7l0ETuIHcTO3E9Lm3rO/Aex02aOu/HiDLZuIBg7 ducación a nivel universitario es otra área en la que se han realizado progresos desde la década de 1960.  En 2019, 26% de afroestadounidenses completaron cuatro años de educación superior en comparación con solo el 4% en 1962. Los logros universitarios de los estadounidenses blancos también han aumentado más de la mitad desde la década de 1960.  (Gráfico 1).<\/p>\n<p>Grafico 1: Educación superior según la raza, entre 1962 y 2019, porcentaje de personas que completaron cuatro años o más de universidad.<\/p>\n<p>Fuente: Buró del censo de EEUU<\/p>\n<p>Se ha avanzado en la representación Afroestadounidense en la política, al punto que el actual Congreso de Estados Unidos es el más diverso de la historia del país. A medida que los derechos de voto se ampliaron durante el movimiento de derechos civiles, aumentó el número de legisladores negros. El primer Congreso electo de la década de 1960 tenía solo cuatro miembros afroestadounidenses, pero a fines del decenio, había 11. Este número ha seguido creciendo y se ha más que duplicado desde el comienzo de la década de 1990.  (Tabla 2).<\/p>\n<p>Congreso No. 87: 1961 - 1962<\/p>\n<p>Cámara de Representantes<\/p>\n<p>437 congresistas<\/p>\n<p>Afroestadounidenses<\/p>\n<p>Hispanos<\/p>\n<p>Estadounidenses de origen asiático<\/p>\n<p>Nativo Estadounidense (amerindios)<\/p>\n<p>Estadounidenses Blancos<\/p>\n<p>4<\/p>\n<p>0<\/p>\n<p>0<\/p>\n<p>1<\/p>\n<p>432<\/p>\n<p>Senado                                                                                                           100 senadores<\/p>\n<p>Afroestadounidenses<\/p>\n<p>Hispanos<\/p>\n<p>Estadounidenses de origen asiático<\/p>\n<p>Nativo Estadounidense<\/p>\n<p>(amerindios)<\/p>\n<p>Estadounidenses Blancos<\/p>\n<p>0<\/p>\n<p>1<\/p>\n<p>1<\/p>\n<p>0<\/p>\n<p>98<\/p>\n<p>Congreso No. 116: 2019 – actualidad<\/p>\n<p>Cámara de Representantes<\/p>\n<p>435 congresistas<\/p>\n<p>Afroestadounidenses<\/p>\n<p>Hispanos<\/p>\n<p>Estadounidenses de origen asiático<\/p>\n<p>Nativo E e 2022 se registraron 74 homicidios en la ciudad, 17 menos frente a enero de 2021; en febrero de 2022 ocurrieron 87 homicidios, 24 más que en el mismo mes de 2021; y en marzo de 2022 igual cantidad que en 2021 (Gráfico 1).<\/p>\n<p>Gráfico 1: Número de homicidios en Cali<\/p>\n<p>enero – marzo 2021 – marzo 2022.<\/p>\n<p>Fuente: Observatorio de Seguridad (Informes Mensuales) – Elaboración Cali como Vamos<\/p>\n<p>Los delitos contra el patrimonio son aquellos destinados a menoscabar el activo de bienes y derechos de un particular, persona jurídica o institución pública, con ánimo de lucro ya sea propio o beneficio de un tercero.<\/p>\n<p>De acuerdo con las estadísticas delictivas reportadas por la policía nacional, entre enero y marzo de 2022 se reportaron 4.693 denuncias de hurtos a personas en Cali, cifra 19.7% superior a las denuncias registradas en el mismo periodo de 2021 (3.920). Todos los meses de 2022 incrementaron el número de denuncias de hurtos a personas respecto al 2021 (Gráfico 2).<\/p>\n<p>Gráfico 2: Número de denuncias de hurtos a personas en Cali.<\/p>\n<p>enero – marzo (2021 – 2022).<\/p>\n<p>Fuente: Estadísticas delictivas Policía Nacional – Cálculos Cali como Vamos<\/p>\n<p>En denuncias a hurto a personas aumentó 19.7%, 14.6% en denuncias por hurto a motocicletas y en 3.8% en denuncias de hurto a automóviles. Se evidenció una disminución de 42.9% en las denuncias de hurtos a entidades financieras, de 33.6% en las denuncias de hurto a residencias y de 31.1% en las denuncias de hurto a comercios.<\/p>\n<p>Según las estadísticas delictivas de la Policía Nacional, en el primer trimestre de 2022 en Cali se registraron 698 denuncias de hurto a motocicletas, 14.6% más frente al mismo período de 2021 (609 denuncias) (Gráfica 3).<\/p>\n<p>Gráfico 3: Número de denuncias de hurtos a motocicletas en Cali.<\/p>\n<p>Enero – Marzo (2021 – 2022).<\/p>\n<p>Fuente: Estadísticas delictivas Policía Nacional – Cálculos Cali como Vamos<\/p>\n<p>A marzo de 2022, en Cali se registraron 441 denuncias de hurtos a automóviles según la Policía Nacional, el dato es 3.8% mayor al registrado en 2021 (425 denuncias). Por mes, aunque en enero de 2022 se vio una reducción en las denuncias frente al 2021.<\/p>\n<p>Gráfico 4: Número de denuncias de hurtos de automóviles en Cali.<\/p>\n<p>Enero – Marzo (2021 – 2022).<\/p>\n<p>Fuente: Estadísticas delictivas Policía Nacional – Cálculos Cali como Vamos<\/p>\n<p>De acuerdo con la información responda las siguientes cinco preguntas:<\/p>\n<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAg4AAAEfCAMAAAAeB76oAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAK7UExURQAAAEBAQEBAQDMzMz09PT4+Pj4+Pjs7Oz09PUBAQP///z09Pf///0BAQD8/Pz4+PvLy8u3t7UBAQOTk5N/f3z8/P9HR0c/Pz8zMzMjIyMTExMHBwbm5ubS0tEBAQK+vr////z8/P6urq6ioqD8/P6ampqOjo56enkBAQD8/P/j4+JmZmZWVlT8/P5KSkvr6+oyMjIiIiISEhPr6+oCAgHx8fPr6+nl5eT8/P3V1dT8/P3Jycvz8/D8/P3BwcG9vb25ubmpqaj8/P2lpaWdnZz8/P////2JiYmJiYl9fX15eXkBAQFtbWz8/P1tbW1lZWVhYWFhYWD8/P1dXV1VVVVRUVFqb1XCtR//AAF+e1nSvTP/BB2Og1nexT//CDVFRUWei2HuzVf/EFHGo23+1WoS5YP/JI4m8aE9PT3uv3YCy34y9a4+/cP/MM//OOT8/P4Cy3pDAcJjEek5OTom34Yu54pjDev/RSP/TTJO946DJhf/WVkxMTJS+46HKh//WWT8/P6nNkWSg1nixUZ/F5qvQlP7DD//abKfK6bLTnavM6bbVoP/efK/O6v/hg7PR7LPS7L3Zqr3Zq//iif/iikhISMLdsD8/P7/Y7sDZ70ZGRsHa78fd8c7iv//noP/qp8ne8c/jw//qq7XT7Mzg8dPmxv/jjf/rsNDi8tbnyUBAQLXS677ZrNbn9djozf7ijURERNro9t/s1f/wxbbS7Nvp9t3q99/r99/s1+Hu2f/jjv/yyuDs9+Lt+OTw3ebx3//00ENDQ+Tv+Ojy4enz4//11j8/P+bw+ejy+enz4+z05f/12e30+u71++/26/D27P/44v/440FBQe/1+/H37fL3/PP48P/55v/66vP4/PX58v/67ff6/fj79vn7/fr8+Pr8/vv9+v3+/f3+///89v/9+P///EBAQP///0nsh9oAAADndFJOUwAECAoVHSErNjxER1BYXWJjZWhoaW1vcHJzdXd7fYCAgIGChIaGiIuMjY2OkZKUlJmcn6Cjpqipq6yvsbGysrS1ubu7vL/Aw8TGyczMzc3O0NHS1NXY2dnZ2tra29vb3Nzc3N3d3d3f4ODg4ODg4OHh4eLj4+Pj4+Pk5OTl5eXl5+fo6Ojo6Ojp6erq6uvr7Ozs7Ozs7e3u7+/w8PDw8PDx8fHy8vLy8vPz9PT09PT09fX19fb29vb29vb29/f39/f4+Pj4+Pn5+fn5+fr6+vr6+vv7+/v7+/v8/Pz9/f7+/v7+/v7+/lrRuzIAAAAJcEhZcwAAFxEAABcRAcom8z8AAAzSSURBVHhe7d2JfxxlGcDxBLSAB6SmiiQUq2AR69FGUZCojSAVz3I0kpYqhyitEdCiKNj
